name: Supabase Keep-Alive

# Impedisce che il progetto Supabase (piano free) venga messo in pausa
# dopo ~7 giorni di inattività. Esegue un ping giornaliero al database
# tramite l'API REST (PostgREST). La query è anonima e, grazie alle RLS
# attive su tutte le tabelle, non legge alcun dato: serve solo a generare
# attività sul database per tenerlo "sveglio".
#
# URL e chiave qui sotto sono PUBBLICI (la publishable key è già inclusa
# nel bundle del frontend), quindi non serve configurare alcun secret.

on:
  schedule:
    # Ogni giorno alle 06:00 UTC
    - cron: "0 6 * * *"
  # Permette anche l'avvio manuale dalla tab "Actions" di GitHub
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: "https://twgdcmuxevaddfhjlfcn.supabase.co"
          SUPABASE_KEY: "sb_publishable_N1iMIJUazOu-dtMsmxG9vA_sR9wpN9H"
        run: |
          echo "Ping a Supabase per mantenere il progetto attivo..."
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")
          echo "HTTP status: ${HTTP_CODE}"
          echo "Risposta: $(cat /tmp/resp.txt)"
          # 200 (ok) o 206 (partial) = database raggiungibile e attivo
          if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "206" ]; then
            echo "✅ Supabase è attivo."
          else
            echo "❌ Ping fallito (HTTP ${HTTP_CODE})."
            exit 1
          fi
